
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: swoo-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ep-muddy-lab-b5rvytdx-pooler.c-7.us-east-2.aws.neon.tech/swoo-tech-mart?sslmode=require&channel_binding=require"
      SPRING_DATASOURCE_USERNAME: neondb_owner
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

    restart: unless-stopped
