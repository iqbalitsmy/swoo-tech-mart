# Add inside the existing `app:` block in application.yml


  payments:
    # existing mock webhook-secret stays as-is, still used by MockPaymentGatewayClient
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:dev-only-webhook-shared-secret-change-me}

    # NEW — Stripe-specific config
    stripe:
      # Secret key from https://dashboard.stripe.com/test/apikeys (starts with sk_test_ in test mode).
      # NEVER commit a real key — always inject via env var in every environment past local dev.
      secret-key: ${STRIPE_SECRET_KEY:}
      # Signing secret for the specific webhook endpoint you register in the Stripe
      # Dashboard (or the one printed by `stripe listen` locally — see explanation below).
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

    # NEW — used by PaymentService when building each Payment row, and as
    # StripePaymentGatewayClient's fallback if Payment.currency is somehow null
    currency: usd