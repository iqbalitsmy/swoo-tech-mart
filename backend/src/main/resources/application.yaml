server:
  port: 8080

spring:
  application:
    name: swoo-tech-mart

  datasource:
    url: jdbc:postgresql://ep-muddy-lab-b5rvytdx-pooler.c-7.us-east-2.aws.neon.tech/swoo-tech-mart?sslmode=require&channel_binding=require
    username: neondb_owner
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  # ---------- OAuth2 (Google) ----------
  # Replace the placeholder client-id/secret with real values, e.g. via env vars:
  # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

# ---------- App / JWT settings ----------
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE}
  oauth2:
    authorized-redirect-uris:
      - http://localhost:5173/oauth2/redirect

  shipping:
    flat-fee: 5.00
    free-shipping-threshold: 50.00


  payments:
    # existing mock webhook-secret stays as-is, still used by MockPaymentGatewayClient
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET}

    # NEW — Stripe-specific config
    stripe:
      # Secret key from https://dashboard.stripe.com/test/apikeys (starts with sk_test_ in test mode).
      # NEVER commit a real key — always inject via env var in every environment past local dev.
      secret-key: ${STRIPE_SECRET_KEY}
      # Signing secret for the specific webhook endpoint you register in the Stripe
      # Dashboard (or the one printed by `stripe listen` locally — see explanation below).
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}

    # NEW — used by PaymentService when building each Payment row, and as
    # StripePaymentGatewayClient's fallback if Payment.currency is somehow null
    currency: usd

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  upload-folder: swoo-tech-mart/products


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - beans
          - mappings
          - metrics
          - loggers
          - env
          - configprops
          - conditions
          - caches
          - threaddump
