spring:
  application:
    name: swoo-tech-mart

server:
  port: 8080

# H2 memory
datasource:
  url: jdbc:h2:mem:swootechmart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password:

h2:
  console:
    enabled: true
    path: /h2-console

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true
  open-in-view: false

sql:
  init:
    mode: always
    data-locations: classpath:data.sql

# ---------- OAuth2 (Google) ----------
security:
  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID:changeme-client-id}
          client-secret: ${GOOGLE_CLIENT_SECRET:changeme-client-secret}
          scope:
            - email
            - profile

# ---------- App / JWT settings ----------
app:
  jwt:
    # 256-bit+ secret required for HS256. Override via JWT_SECRET env var in real deployments.
    secret: ${JWT_SECRET:c3dvby10ZWNoLW1hcnQtc3VwsXItc2VjcmV0LWtleS1jaGFuZ4UtbWUtaW4tcHJvZHVjdGlvbg==}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  oauth2:
    authorized-redirect-uris:
      - http://localhost:5173/oauth2/redirect