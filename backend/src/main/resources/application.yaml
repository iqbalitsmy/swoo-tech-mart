  datasource:
    url: jdbc:postgresql://localhost:5432/swootechmart
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true




  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  # ---------- OAuth2 (Google) ----------
  # Replace the placeholder client-id/secret with real values, e.g. via env vars:
  # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:x}
            client-secret: ${GOOGLE_CLIENT_SECRET:xx}
            scope:
              - email
              - profile

# ---------- App / JWT settings ----------
app:
  jwt:
    secret: ${JWT_SECRET:==}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  oauth2:
    authorized-redirect-uris:
      - http://localhost:5173/oauth2/redirect

  shipping:
    flat-fee: 5.00
    free-shipping-threshold: 50.00


